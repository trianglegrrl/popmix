{% set name = "popmix" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # For bioconda, replace with the PyPI sdist once popmix is published:
  #   url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  #   sha256: <sha256 of the sdist>
  # local builds: the committed tree, without build outputs and test data
  git_url: ..

build:
  number: 0
  skip: true  # [py<39]
  entry_points:
    - popmix = popmix.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.4,<2.0
  run:
    - python
    - numpy >=1.21
    - pandas >=1.5
    - click >=8.0

test:
  imports:
    - popmix
    - popmix._core
  commands:
    - popmix --help
    - popmix --version
    - popmix qpdstat --help
    - popmix qpadm --help
    - popmix qpgraph --help
    - popmix pca --help
    - popmix admixture --help
    - popmix rolloff --help
    - popmix dates --help

about:
  home: https://github.com/trianglegrrl/popmix
  license: MIT AND BSD-3-Clause
  license_family: MIT
  license_file:
    - LICENSE
    - NOTICE
    - THIRDPARTY.yml
  summary: Population genetics f-statistics, admixture graphs, qpAdm, PCA, ADMIXTURE and admixture dating
  description: |
    Popmix reimplements admixtools2 (f2, f3, f4, D, qpWave, qpAdm, qpGraph and
    graph search, resampling), smartpca, KING-robust and READ kinship,
    site-frequency spectra, ADMIXTURE, DATES and ROLLOFF in Rust with a
    Python interface and command line. Each is checked against the original
    tool on real data; known bugs in the originals are fixed by default and
    reproducible with a compat option (DEVIATIONS.md).
  dev_url: https://github.com/trianglegrrl/popmix

extra:
  recipe-maintainers:
    - trianglegrrl
