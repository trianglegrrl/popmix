[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "popmix"
version = "1.0.0"
description = "Population genetics F-statistics and admixture analysis toolkit"
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.5",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
plot = [
    "matplotlib>=3.5",
]
all = [
    "popmix[plot]",
]

[project.scripts]
popmix = "popmix.cli:main"

[project.urls]
Homepage = "https://github.com/trianglegrrl/popmix"
Documentation = "https://github.com/trianglegrrl/popmix#readme"
Repository = "https://github.com/trianglegrrl/popmix"

[tool.maturin]
module-name = "popmix._core"
python-source = "python"
features = ["pyo3/extension-module"]
manifest-path = "crates/popmix-python/Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/golden"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
# requires-python >= 3.9
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["popmix"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
