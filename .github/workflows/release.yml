# Build wheels and the sdist, check that each wheel installs and runs, and
# publish to PyPI when a version tag (v1.2.3) is pushed. Running it by hand
# (workflow_dispatch) builds and checks without publishing.
#
# Publishing uses PyPI trusted publishing: on pypi.org, the popmix project
# trusts this repository, workflow file release.yml and environment "pypi".
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: --release --out dist
      # one abi3 wheel serves every Python: check it on the oldest and newest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: bash .github/scripts/check-wheel.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: bash .github/scripts/check-wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    # universal2: one wheel for both Intel and Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist
      # one abi3 wheel serves every Python: check it on the oldest and newest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: bash .github/scripts/check-wheel.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: bash .github/scripts/check-wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-universal2
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      # one abi3 wheel serves every Python: check it on the oldest and newest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - shell: bash
        run: bash .github/scripts/check-wheel.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - shell: bash
        run: bash .github/scripts/check-wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/popmix/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
