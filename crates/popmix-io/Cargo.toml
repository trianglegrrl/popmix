[package]
name = "popmix-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "File format I/O for population genetics data (PLINK, EIGENSTRAT, PACKEDANCESTRYMAP)"

[dependencies]
popmix-core = { path = "../popmix-core", version = "=1.0.0" }
