[package]
name = "popmix-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for popmix population genetics toolkit"
# the extension module inside the wheel, not a crate of its own
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
popmix-core = { path = "../popmix-core", version = "=1.0.0", features = ["python"] }
popmix-io = { path = "../popmix-io", version = "=1.0.0" }
pyo3 = { workspace = true }
numpy = { workspace = true }
ndarray = { workspace = true }
serde_json = "1.0"

[lints]
workspace = true
