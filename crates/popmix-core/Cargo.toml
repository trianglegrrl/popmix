[package]
name = "popmix-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core algorithms for population genetics F-statistics and admixture analysis"

[dependencies]
ndarray = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
petgraph = { workspace = true }
itertools = { workspace = true }
rustfft = "6.2"  # FFT for O(N log N) LD computation in DATES
nalgebra = "0.33"
faer = "0.24"
statrs = "0.18"
# erfc to the last bit (musl's), for p-values as R and Python give them
libm = "0.2.16"
# only for the bindings: From<PopmixError> for PyErr (feature "python")
pyo3 = { workspace = true, optional = true }

[features]
python = ["dep:pyo3"]

[dev-dependencies]
serde_json = "1.0"
approx = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "kernels"
harness = false

[lints]
workspace = true
