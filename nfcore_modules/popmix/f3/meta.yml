name: "popmix_f3"
description: Compute f3 statistic to test for admixture
keywords:
  - population genetics
  - f-statistics
  - admixture
tools:
  - popmix:
      description: Population genetics toolkit for F-statistics and admixture analysis
      homepage: https://github.com/your-repo/popmix
      documentation: https://github.com/your-repo/popmix
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - f2_blocks:
      type: directory
      description: Directory containing pre-computed F2 blocks
      pattern: "*_f2"
  - target:
      type: string
      description: Target (potentially admixed) population
  - source1:
      type: string
      description: First source population
  - source2:
      type: string
      description: Second source population

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - results:
      type: file
      description: F3 statistic results in JSON format
      pattern: "*_f3.json"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@your-username"
