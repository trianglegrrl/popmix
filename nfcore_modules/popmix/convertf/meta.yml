name: "popmix_convertf"
description: Convert between genotype file formats
keywords:
  - population genetics
  - file conversion
  - eigenstrat
  - plink
tools:
  - popmix:
      description: Population genetics toolkit for F-statistics and admixture analysis
      homepage: https://github.com/your-repo/popmix
      documentation: https://github.com/your-repo/popmix
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', format:'eigenstrat' ]
  - geno_files:
      type: file
      description: Input genotype files
      pattern: "*"
  - output_format:
      type: string
      description: |
        Output format. One of:
        - plink (binary PLINK .bed/.bim/.fam)
        - ped (text PLINK .ped/.map)
        - eigenstrat (text EIGENSTRAT .geno/.snp/.ind)
        - packedancestrymap (binary EIGENSTRAT .geno/.snp/.ind)
        - ancestrymap (sparse .ancestrymapgeno/.snp/.ind)

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - converted:
      type: file
      description: Converted genotype files
      pattern: "*"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@your-username"
