name: "popmix_dates"
description: Estimate admixture timing using DATES algorithm
keywords:
  - population genetics
  - admixture
  - dating
tools:
  - popmix:
      description: Population genetics toolkit for F-statistics and admixture analysis
      homepage: https://github.com/your-repo/popmix
      documentation: https://github.com/your-repo/popmix
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - geno_files:
      type: file
      description: Genotype files (EIGENSTRAT, PLINK, etc.)
      pattern: "*"
  - test_pop:
      type: string
      description: Test (admixed) population
  - source1:
      type: string
      description: First source population
  - source2:
      type: string
      description: Second source population

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - results:
      type: file
      description: DATES results in JSON format
      pattern: "*_dates.json"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@your-username"
