[workspace]
resolver = "2"
members = [
    "crates/popmix-core",
    "crates/popmix-io",
    "crates/popmix-python",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
# the toolchain CI builds with (rust-toolchain.toml): 1.92 miscompiled F2Blocks::build
rust-version = "1.99"
license = "MIT AND BSD-3-Clause"
authors = ["Popmix Contributors"]
repository = "https://github.com/trianglegrrl/popmix"
description = "Population genetics F-statistics and admixture analysis"

[workspace.dependencies]
# Core dependencies
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
thiserror = "2.0"
petgraph = "0.6"

# I/O
memmap2 = "0.9"
byteorder = "1.5"
flate2 = "1.0"

# Python bindings
pyo3 = { version = "0.29.3", features = ["extension-module"] }
numpy = "0.29.0"

# Utilities
itertools = "0.13"

# Testing
approx = "0.5"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
